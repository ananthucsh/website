<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .error-page {
            padding: 30px;
        }

        .error-page h1 {
            font-size: 120px;
            color: #222;
            line-height: 1;
        }

        .error-page h2 {
            font-size: 30px;
            margin: 20px 0 10px;
        }

        .error-page p {
            color: #666;
            margin-bottom: 25px;
        }

        .home-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .home-btn:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="error-page">
        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>
            Sorry, the page you are looking for doesn't exist.
        </p>

        <a href="/" class="home-btn">
            Go Home
        </a>
    </div>

</body>
</html>
